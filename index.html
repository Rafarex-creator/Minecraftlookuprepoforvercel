<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Player Lookup</title>
    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        input {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .card {
            margin-top: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
            display: inline-block;
            min-width: 300px;
        }
        img {
            margin-top: 10px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h1>Minecraft Player Lookup</h1>

<input type="text" id="username" placeholder="Enter Minecraft Username">
<button onclick="lookupPlayer()">Search</button>

<div id="result"></div>

<script>
async function lookupPlayer() {
    const username = document.getElementById("username").value.trim();
    const resultDiv = document.getElementById("result");

    if (!username) {
        resultDiv.innerHTML = "<p class='error'>Please enter a username.</p>";
        return;
    }

    resultDiv.innerHTML = "Loading...";

    try {
        // Fetch player info from PlayerDB
        const response = await fetch(`https://playerdb.co/api/player/minecraft/${username}`);
        const data = await response.json();

        if (!data.success) {
            resultDiv.innerHTML = "<p class='error'>Player not found.</p>";
            return;
        }

        const uuid = data.data.player.raw_id;

        resultDiv.innerHTML = `
            <div class="card">
                <h2>${data.data.player.username}</h2>
                <p><strong>UUID:</strong> ${uuid}</p>

                <h3>Player Head</h3>
                <img src="https://crafatar.com/avatars/${uuid}?size=100" alt="Head">

                <h3>Full Skin (Flat)</h3>
                <img src="https://crafatar.com/skins/${uuid}" alt="Skin" width="150">
            </div>
        `;

    } catch (error) {
        resultDiv.innerHTML = "<p class='error'>Error fetching player data.</p>";
    }
}
</script>

</body>
</html>
