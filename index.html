<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft 3D Player Lookup</title>
<style>
  body { margin: 0; background: #1e1e1e; font-family: Arial, sans-serif; color: white; text-align: center; }
  #ui { padding: 20px; }
  input { padding: 10px; width: 250px; border-radius: 5px; border: none; font-size: 16px; }
  button { padding: 10px 15px; border-radius: 5px; border: none; background: #4CAF50; color: white; font-size: 16px; cursor: pointer; }
  button:hover { background: #45a049; }
  #container { width: 400px; height: 400px; margin: 20px auto; border: 2px solid #2a2a2a; border-radius: 10px; }
  .error { color: red; }
</style>
</head>
<body>

<div id="ui">
  <h1>Minecraft 3D Player Lookup</h1>
  <input type="text" id="username" placeholder="Enter Minecraft Username">
  <button onclick="loadPlayer()">Search</button>
  <p id="message"></p>
</div>

<div id="container"></div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls, playerMesh;

// Initialize Three.js scene
function initScene() {
    const container = document.getElementById('container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(2, 3, 5);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(400, 400);
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);

    animate();
}

// Animation loop
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

// Load Minecraft player
async function loadPlayer() {
    const username = document.getElementById('username').value.trim();
    const message = document.getElementById('message');
    message.textContent = '';

    if (!username) {
        message.textContent = "Please enter a username.";
        return;
    }

    message.textContent = "Loading...";

    try {
        // Get UUID from PlayerDB
        const res = await fetch(`https://playerdb.co/api/player/minecraft/${username}`);
        const data = await res.json();

        if (!data.success) {
            message.textContent = "Player not found.";
            return;
        }

        const playerName = data.data.player.username;
        const uuid = data.data.player.raw_id;
        message.textContent = `Showing ${playerName} (${uuid})`;

        const skinURL = `https://mc-heads.net/skin/${playerName}`;

        // Init scene if not already
        if (!scene) initScene();

        // Remove old mesh
        if (playerMesh) scene.remove(playerMesh);

        // Load texture
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = '';
        loader.load(skinURL, function(texture) {
            // Simple humanoid: head + body + legs
            const group = new THREE.Group();

            const material = new THREE.MeshBasicMaterial({ map: texture });

            // Head
            const headGeo = new THREE.BoxGeometry(1,1,1);
            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 2.5;
            group.add(head);

            // Body
            const bodyGeo = new THREE.BoxGeometry(1,1.5,0.5);
            const body = new THREE.Mesh(bodyGeo, material);
            body.position.y = 1.25;
            group.add(body);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.5,1,0.5);
            const leftLeg = new THREE.Mesh(legGeo, material);
            leftLeg.position.set(-0.25, 0.5, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, material);
            rightLeg.position.set(0.25, 0.5, 0);
            group.add(rightLeg);

            scene.add(group);
            playerMesh = group;
        });

    } catch (err) {
        console.error(err);
        message.textContent = "Error fetching player data.";
    }
}

// Enter key search
document.getElementById("username").addEventListener("keyup", function(event) {
    if (event.key === "Enter") loadPlayer();
});
</script>

</body>
</html>
