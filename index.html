<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Player Lookup</title>
    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .card {
            margin-top: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
            display: inline-block;
            min-width: 300px;
            transition: transform 0.3s;
        }

        /* 3D hover effect for head */
        .card:hover {
            transform: perspective(600px) rotateY(10deg);
        }

        img {
            margin-top: 10px;
            transition: transform 0.3s;
        }

        img.head:hover {
            transform: rotateY(10deg);
        }

        /* 3D rotation animation for body */
        img.body {
            display: block;
            margin: 10px auto;
            width: 150px;
            transform-style: preserve-3d;
            animation: spin 5s linear infinite;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<h1>Minecraft Player Lookup</h1>

<input type="text" id="username" placeholder="Enter Minecraft Username">
<button onclick="lookupPlayer()">Search</button>

<div id="result"></div>

<script>
async function lookupPlayer() {
    const username = document.getElementById("username").value.trim();
    const resultDiv = document.getElementById("result");

    if (!username) {
        resultDiv.innerHTML = "<p class='error'>Please enter a username.</p>";
        return;
    }

    resultDiv.innerHTML = "Loading...";

    try {
        // Fetch player info from PlayerDB
        const response = await fetch(`https://playerdb.co/api/player/minecraft/${username}`);
        const data = await response.json();

        if (!data.success) {
            resultDiv.innerHTML = "<p class='error'>Player not found.</p>";
            return;
        }

        const uuid = data.data.player.raw_id;
        const playerName = data.data.player.username;

        // Show info with mc-heads.net
        resultDiv.innerHTML = `
            <div class="card">
                <h2>${playerName}</h2>
                <p><strong>UUID:</strong> ${uuid}</p>

                <h3>Player Head</h3>
                <img src="https://mc-heads.net/avatar/${playerName}/100" alt="Head" class="head">

                <h3>Full Body (3D Spin)</h3>
                <img src="https://mc-heads.net/body/${playerName}/200" alt="Body" class="body">
            </div>
        `;

    } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "<p class='error'>Error fetching player data.</p>";
    }
}

// Enter key search
document.getElementById("username").addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        lookupPlayer();
    }
});
</script>

</body>
</html>
